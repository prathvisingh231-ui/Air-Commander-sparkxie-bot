name: Dashboard safety tests

on:
  push:
    branches:
      - main
      - feature/dashboard-config-phase1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "discord.py>=2.5,<3" "Flask>=3,<4" "asyncpg>=0.30,<1"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run dashboard safety tests
        run: python -m unittest discover -s tests -v
