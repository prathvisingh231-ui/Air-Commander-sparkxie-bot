name: Python syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot and changed feature modules
        run: python -m py_compile bot.py snipe.py backup_system.py config_dashboard.py diagnostics.py modlog.py
