services:
  - type: web
    name: air-commander-sparkxie-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_SECRET_KEY
        sync: false
      - key: DASHBOARD_BASE_URL
        value: https://air-commander-sparkxie-bot-850o.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: air-commander-db
          property: connectionString
